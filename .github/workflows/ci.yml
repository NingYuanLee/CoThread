name: CI

on:
  push:
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.19.x, 24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run lint

  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_DATABASE: cothread_test
          MYSQL_USER: cothread
          MYSQL_PASSWORD: test-pass
          MYSQL_ROOT_PASSWORD: root-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_HOST_PUBLIC: 127.0.0.1:3306/cothread_test
          TEST_DATABASE_AUTH: cothread:test-pass
