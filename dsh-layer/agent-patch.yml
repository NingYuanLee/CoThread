# DSH owns reasoning and sessions; model-facing I/O uses the sandbox bridge.
- insert:
    - id: session-query
      name: '@deepseek-ai/dsh-session-query'
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'
    - id: subagent-service
      name: '@deepseek-ai/dsh-subagent'
    - id: subagent-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
    - id: subagent-tool
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: dsh_l3
        backgroundMode: continuable
        maxDepth: 1
    - id: subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: subagent-list
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.7
        # DSH 0.2 sizes the pressure budget as contextWindow - request maxTokens
        # - headroom. Keep this headroom small so the native step threshold still
        # lands on the shared 70% budget (see dshModelMaxTokens).
        headroomTokens: 8192
        retainTokens: 32000
        maxTokens: 8192
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        fetchProvider: http
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        search: false
        searchTimeoutMs: 60000
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: ''
