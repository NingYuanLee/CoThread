# 0.2.2-rc.1 的 sdk-minimal 已自带 attachment-local / token-meter / compaction-basic，
# 老翁装配单只覆盖配置。
- id: attachment-local
  config:
    # 文档记忆会把原图直接交给视觉模型。高 DPI 截图的长边经常超过 DSH 默认的
    # 8192 准入上限，不改会被判「Image exceeds the configured per-side pixel limit」
    # 并反复重试。放宽准入后仍由 DSH 归一化按默认 8192 长边 / 4.19MP / 4MB 缩图
    # 再送给模型；总量安全上限（maxImagePixels 64MP）保持不变。
    maxImageDimension: 16384
- id: compaction-basic
  config:
    thresholdRatio: 0.7
    # See dsh-layer/agent-patch.yml: keeps the native pressure budget aligned
    # with the shared 70% threshold.
    headroomTokens: 8192
    retainTokens: 64000
    maxTokens: 8192
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: ""
